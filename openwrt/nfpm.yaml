# =============================================================================
# nfpm 配置模板 — 生成 luci-app-cfstmgrd 的「单个 all 架构」OpenWrt .ipk 包
#
#   本包是 Architecture: all：不含任何 CPU 相关二进制，只装壳子：
#     procd 服务脚本 + UCI 配置 + cfstmgrd-fetch（装时按本机 CPU 联网拉二进制）。
#   一个包到处可装，由 postinst/网页调 cfstmgrd-fetch 下载对应架构的 cfstmgrd 到 /usr/bin。
#
#   __XXX__ 占位符由 build-ipk.sh 用 sed 渲染（src 均为绝对路径，消除 CWD 歧义）。
#
#   产出可被 opkg (OpenWrt <=24.10) 安装的 ipk。OpenWrt 25.12+ 默认 apk(APKv3)，
#   需另走 SDK，详见 openwrt/README.md。
# =============================================================================

name: "luci-app-cfstmgrd"
arch: "all"
platform: "linux"
version: "__PKG_VERSION__"
release: "__PKG_RELEASE__"
section: "net"
priority: "optional"
maintainer: "mia-clark <mia-clark@users.noreply.github.com>"
vendor: "mia-clark"
homepage: "https://github.com/mia-clark/cfst-manager"
license: "GPL-3.0"
description: |
  CDN preferred-IP speed test manager (cfstmgrd), OpenWrt wrapper (all-arch).
  Ships the procd service, UCI config and a fetcher that downloads the
  CPU-matching cfstmgrd binary from GitHub Releases on install. One package
  installs on any architecture. Configure via UCI at /etc/config/cfstmgrd.

# 依赖 LuCI（web 壳子）。二进制是纯静态、由网页/postinst 下载，不算依赖。
depends:
  - "luci-base"
  - "luci-compat"

# 顶替潜在的旧裸包名 cfstmgrd（若曾发布过）：老用户装新包时自动卸旧包平滑升级。
replaces:
  - "cfstmgrd"
conflicts:
  - "cfstmgrd"

contents:
  # procd 服务脚本
  - src: "__INITD_SRC__"
    dst: "/etc/init.d/cfstmgrd"
    file_info:
      mode: 0755

  # UCI 默认配置 (标记 config|noreplace：升级时保留用户修改)
  - src: "__CONFIG_SRC__"
    dst: "/etc/config/cfstmgrd"
    type: "config|noreplace"
    file_info:
      mode: 0644

  # 二进制拉取器（按 CPU 架构联网下载对应二进制）
  - src: "__FETCH_SRC__"
    dst: "/usr/sbin/cfstmgrd-fetch"
    file_info:
      mode: 0755

  # 随包版本号（cfstmgrd-fetch 默认拉取此版本）
  - src: "__VERSION_SRC__"
    dst: "/usr/lib/cfstmgrd/VERSION"
    file_info:
      mode: 0644

  # LuCI web 壳子：控制器 + 视图 + ACL + uci-defaults
  - src: "__LUA_CTRL__"
    dst: "/usr/lib/lua/luci/controller/cfstmgr.lua"
    file_info:
      mode: 0644
  - src: "__LUA_VIEW__"
    dst: "/usr/lib/lua/luci/view/cfstmgr/main.htm"
    file_info:
      mode: 0644
  - src: "__ACL_LUCI__"
    dst: "/usr/share/rpcd/acl.d/luci-app-cfstmgrd.json"
    file_info:
      mode: 0644
  - src: "__UCIDEF_LUCI__"
    dst: "/etc/uci-defaults/40_luci-cfstmgrd"
    file_info:
      mode: 0755

scripts:
  postinstall: "__POSTINST__"
  preremove: "__PRERM__"
  postremove: "__POSTRM__"

# 单个 all 包，Architecture: all 可装到任意设备
ipk:
  arch: "all"
